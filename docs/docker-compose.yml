# Déploiement Dokploy en mode "Docker Compose".
# Build l'image depuis le Dockerfile (port 3000) et déclare le routage Traefik
# via labels (méthode fiable en mode Compose : Traefik lit les labels du conteneur).
# Le service rejoint dokploy-network pour que Traefik puisse l'atteindre.

services:
  docs:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    expose:
      - "3000"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTPS (443)
      - traefik.http.routers.docs-inkwei.rule=Host(`docs.inkwei.com`)
      - traefik.http.routers.docs-inkwei.entrypoints=websecure
      - traefik.http.routers.docs-inkwei.tls.certresolver=letsencrypt
      - traefik.http.services.docs-inkwei.loadbalancer.server.port=3000
      # HTTP (80) -> HTTPS
      - traefik.http.routers.docs-inkwei-web.rule=Host(`docs.inkwei.com`)
      - traefik.http.routers.docs-inkwei-web.entrypoints=web
      - traefik.http.routers.docs-inkwei-web.middlewares=docs-inkwei-redirect
      - traefik.http.middlewares.docs-inkwei-redirect.redirectscheme.scheme=https

networks:
  dokploy-network:
    external: true
